name: Deploy result explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "results_explorer/public/**"
      - ".github/workflows/results-explorer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static explorer
        run: cp results_explorer/public/explorer.html results_explorer/public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: results_explorer/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
